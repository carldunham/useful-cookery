apiVersion: v1
kind: ConfigMap
metadata:
  name: useful-cookery-config
  labels:
    app: useful-cookery
data:
  database.type: "postgres"
  api.url: "http://useful-cookery-api:8080/graphql"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: useful-cookery-config-files
  labels:
    app: useful-cookery
data:
  api-config.yml: |
    # Useful Cookery API Configuration

    # Server configuration
    server:
      port: 8080
      cors_origin: "*"
      enable_playground: true
      read_timeout_seconds: 30
      write_timeout_seconds: 30
      idle_timeout_seconds: 60

    # Database configuration
    database:
      type: postgres
      connection_string: "override with UC_DATABASE_CONNECTION_STRING"

    # Redis configuration
    redis:
      addr: "localhost:6379"
      password: ""
      db: 0

    # Authentication configuration
    auth:
      jwt_secret: "override with UC_JWT_SECRET"
      token_expiry: "24h"

    # AI configuration
    ai:
      openai_api_key: "override with UC_AI_OPENAI_API_KEY"
      embedding_model: "text-embedding-ada-002"
      completion_model: "gpt-3.5-turbo"
      enable_cache: false
      max_tokens: 4000

    # Storage configuration
    storage:
      type: "local"
      local_path: "./uploads"

  migration-config.yml: |
    # Useful Cookery Migration Configuration

    # Database configuration
    database:
      type: postgres
      connection_string: "override with UC_DATABASE_CONNECTION_STRING"
