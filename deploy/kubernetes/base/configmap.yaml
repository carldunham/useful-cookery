apiVersion: v1
kind: ConfigMap
metadata:
  name: useful-cookery-config
  labels:
    app: useful-cookery
data:
  database.type: "postgres"
  api.url: "http://useful-cookery-api:8080/graphql"
  config.path: "/app/config/config.yml"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: useful-cookery-config-file
  labels:
    app: useful-cookery
data:
  config.yml: |
    # Useful Cookery Configuration

    # Server configuration
    server:
      port: "8080"
      cors_origin: "*"
      enable_playground: true
      read_timeout_seconds: 30
      write_timeout_seconds: 30
      idle_timeout_seconds: 60

    # Database configuration
    database:
      type: "postgres"
      connection_string: "${DATABASE_CONNECTION_STRING}"

    # DGraph configuration (for backward compatibility)
    dgraph:
      type: "postgres"
      connection_string: ""

    # Authentication configuration
    auth:
      jwt_secret: "${JWT_SECRET}"
      token_expiry: "24h"

    # AI configuration
    ai:
      openai_key: "${OPENAI_API_KEY}"
      embedding_model: "text-embedding-ada-002"
      completion_model: "gpt-3.5-turbo"
      enable_cache: false
      max_tokens: 4000

    # Storage configuration
    storage:
      type: "local"
      local_path: "./uploads"
