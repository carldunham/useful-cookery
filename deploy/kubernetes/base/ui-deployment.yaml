apiVersion: apps/v1
kind: Deployment
metadata:
  name: useful-cookery-ui
  labels:
    app: useful-cookery
    component: ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: useful-cookery
      component: ui
  template:
    metadata:
      labels:
        app: useful-cookery
        component: ui
    spec:
      containers:
        - name: ui
          image: useful-cookery-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          env:
            - name: REACT_APP_API_URL
              valueFrom:
                configMapKeyRef:
                  name: useful-cookery-config
                  key: api.url
