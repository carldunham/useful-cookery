apiVersion: apps/v1
kind: Deployment
metadata:
  name: useful-cookery-api
  labels:
    app: useful-cookery
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: useful-cookery
      component: api
  template:
    metadata:
      labels:
        app: useful-cookery
        component: api
    spec:
      containers:
        - name: api
          image: useful-cookery-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          env:
            - name: UC_DATABASE_TYPE
              valueFrom:
                configMapKeyRef:
                  name: useful-cookery-config
                  key: database.type
            - name: UC_DATABASE_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: useful-cookery-secrets
                  key: database.connection_string
            - name: UC_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: useful-cookery-secrets
                  key: jwt.secret
            - name: UC_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: useful-cookery-secrets
                  key: openai.api_key
          volumeMounts:
            - name: config-volume
              mountPath: /app/cmd/api/config/config.yml
              subPath: api-config.yml
      volumes:
        - name: config-volume
          configMap:
            name: useful-cookery-config-files
