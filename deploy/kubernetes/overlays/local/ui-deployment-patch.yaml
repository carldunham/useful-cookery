apiVersion: apps/v1
kind: Deployment
metadata:
  name: useful-cookery-ui
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: ui
          image: useful-cookery-ui:local
          imagePullPolicy: Never
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
