apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: useful-cookery-ingress
  annotations:
    kubernetes.io/ingress.class: "alb"
    alb.ingress.kubernetes.io/scheme: "internet-facing"
    alb.ingress.kubernetes.io/target-type: "ip"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: "${ACM_CERTIFICATE_ARN}"
    # CDN integration
    alb.ingress.kubernetes.io/load-balancer-attributes: "routing.http.drop_invalid_header_fields.enabled=true"
    external-dns.alpha.kubernetes.io/hostname: "api.useful-cookery.com,www.useful-cookery.com"
    # CloudFront distribution will be created separately in Terraform
spec:
  rules:
    - host: api.useful-cookery.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: useful-cookery-api
                port:
                  number: 8080
    - host: www.useful-cookery.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: useful-cookery-ui
                port:
                  number: 80
