name: PR Checks

on:
  pull_request:
  workflow_dispatch: # Allow manual triggering

jobs:
  pr-validation:
    name: PR Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Linear issue reference
        if: ${{ github.actor != 'dependabot[bot]' }}
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_BODY="${{ github.event.pull_request.body }}"

          if [[ ! "$PR_TITLE" =~ USE-[0-9]+ ]] && [[ ! "$PR_BODY" =~ USE-[0-9]+ ]]; then
            echo "::error::Pull request must reference a Linear issue in the format 'USE-*' in either the title or description."
            exit 1
          fi

      - name: Check for merge conflicts
        run: |
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "::error::Merge conflicts detected. Please resolve them before merging."
            exit 1
          fi
