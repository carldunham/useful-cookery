name: PR Checks

on:
  pull_request:
  workflow_dispatch: # Allow manual triggering

jobs:
  pr-validation:
    name: PR Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Linear issue reference
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_BODY="${{ github.event.pull_request.body }}"

          if [[ ! "$PR_TITLE" =~ USE-[0-9]+ ]] && [[ ! "$PR_BODY" =~ USE-[0-9]+ ]]; then
            echo "::error::Pull request must reference a Linear issue in the format 'USE-*' in either the title or description."
            exit 1
          fi

      - name: Check for merge conflicts
        run: |
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "::error::Merge conflicts detected. Please resolve them before merging."
            exit 1
          fi

  required-checks:
    name: Required Checks
    runs-on: ubuntu-latest
    needs:
      - pr-validation
    steps:
      - name: Check if backend CI passed
        uses: fountainhead/action-wait-for-check@v1.1.0
        id: backend-ci
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          checkName: "Backend CI"
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          timeoutSeconds: 3600
          intervalSeconds: 10

      - name: Check if frontend CI passed
        uses: fountainhead/action-wait-for-check@v1.1.0
        id: frontend-ci
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          checkName: "Frontend CI"
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          timeoutSeconds: 3600
          intervalSeconds: 10

      - name: Check if additional checks passed
        uses: fountainhead/action-wait-for-check@v1.1.0
        id: additional-checks
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          checkName: "Additional Checks"
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          timeoutSeconds: 3600
          intervalSeconds: 10

      - name: Verify all checks passed
        if: steps.backend-ci.outputs.conclusion != 'success' || steps.frontend-ci.outputs.conclusion != 'success' || steps.additional-checks.outputs.conclusion != 'success'
        run: |
          echo "::error::Not all required checks have passed."
          echo "Backend CI: ${{ steps.backend-ci.outputs.conclusion }}"
          echo "Frontend CI: ${{ steps.frontend-ci.outputs.conclusion }}"
          echo "Additional Checks: ${{ steps.additional-checks.outputs.conclusion }}"
          exit 1
